<!DOCTYPE html>
<html>
    <head>
        <title>tak</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="tak.css" />
        <script type="module" src="tak.js" defer></script>

        <!-- FAVICONS -->
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">
    </head>
    <body>
        <div class="buttons">
            <button class="btn reset-btn">Reset</button>
            <button class="btn end-turn-btn" id="end-turn-btn">End Turn</button>
        </div>

        <div class="board"></div>

        <div class="picker">
            <div class="white-info" id="white-status">White's Turn</div>

            <div class="stones-wrapper">
                <span class="count-label" id="stone-count">21</span>
                <div class="select-box" id="stone-selector">
                    <div class="piece flat-piece" id="stone-preview"></div>
                </div>

                <div class="select-box" id="standing-stone-selector">
                    <div class="piece standing-piece" id="standing-stone-preview"></div>
                </div>
            </div>

            <div class="capstones select-box" id="capstone-selector">
                <span class="count-label" id="capstone-count">1</span>
                <div class="piece capstone-piece" id="capstone-preview"></div>
            </div>

            <div class="black-info" id="black-status">Black Player</div>
        </div>
        <div class="settings-wrapper" id="settings-wrapper">
            <button class="btn settings-btn" id="settings-btn">Settings</button>
            <div class="settings-dropdown" id="settings-dropdown">
                <div class="settings-row">
                    <input type="number" class="btn board-size-input" id="board-size-input" value="6" min="3" max="10" />
                    <button class="btn new-game-btn" id="new-game-btn">New Game</button>
                </div>
                <label class="toggle-row">
                    <span class="toggle-label">Bot</span>
                    <div class="toggle" id="bot-toggle">
                        <div class="toggle-knob"></div>
                    </div>
                </label>
                <label class="toggle-row">
                    <span class="toggle-label">Bot goes first</span>
                    <div class="toggle" id="bot-first-toggle">
                        <div class="toggle-knob"></div>
                    </div>
                </label>
                <div class="slider-group">
                    <div class="slider-header">
                        <span class="slider-label">Difficulty:</span>
                        <span class="slider-value" id="difficulty-value">3</span>
                    </div>
                    <input type="range" id="difficulty-slider" class="ui-slider" min="0" max="6" step="1" value="3">
                </div>
                <label class="toggle-row">
                    <span class="toggle-label">Dark Mode</span>
                    <div class="toggle" id="dark-mode-toggle">
                        <div class="toggle-knob"></div>
                    </div>
                </label>
            </div>
        </div>
        <div class="modal-overlay" id="win-modal">
            <div class="modal-content">
                <div class="modal-title" id="win-message">White Wins!</div>
                <div class="modal-buttons">
                    <button class="btn modal-btn" id="modal-cancel-btn">Close</button>
                    <button class="btn modal-btn" id="modal-new-game-btn">New Game</button>
                </div>
            </div>
        </div>
    </body>
</html>
